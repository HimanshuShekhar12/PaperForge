name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke tests
        env:
          # Dummy key so llm.py's ChatOpenAI(...) can be constructed at
          # import time. These tests never actually call the LLM, so a
          # real key/credits are not needed in CI.
          OPENROUTER_API_KEY: "dummy-key-for-ci"
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t paperforge:ci .